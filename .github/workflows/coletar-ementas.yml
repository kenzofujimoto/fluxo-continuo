name: Coletar evidencias de ementas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coletar-ementas.yml'
permissions:
  contents: write
concurrency:
  group: syllabus-collector
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitores HTML/PDF
        run: python -m pip install -r scripts/requirements-audit.txt
      - name: Coletar ementas com rastreabilidade
        env:
          MAX_SOURCE_URLS: '300'
          AUDIT_WORKERS: '4'
        run: python scripts/collect_syllabi.py
      - name: Verificar registros produzidos
        run: |
          python -m json.tool syllabi/records.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open("syllabi/records.json"))
          assert len(x["foreign"])==2608
          assert len(x["mackenzie"])==221
          print(x["meta"])
          PY
      - name: Persistir evidencias no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syllabi/records.json syllabi/backlog.json syllabi/source-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "data(audit): register source-level syllabus evidence"
            git push
          fi
